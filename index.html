<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>STALZONE Ladder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .container { max-width: 900px; margin-top: 40px; }
        h1 { color: #ffaa00; text-align: center; text-shadow: 0 0 10px rgba(255, 170, 0, 0.5); margin-bottom: 30px; font-weight: bold; }
        .card { background-color: #2a2a2a; border: 1px solid #444; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .card-header { background-color: #333; color: #ffaa00; font-weight: bold; border-bottom: 1px solid #444; }
        .table-dark { --bs-table-bg: #2a2a2a; --bs-table-hover-bg: #3a3a3a; }
        .table th { border-color: #444; color: #aaa; }
        .table td { border-color: #444; vertical-align: middle; }
        
        .rating { font-weight: bold; color: #00ff88; }
        .text-win { color: #00ff88; font-weight: bold; }
        .text-lose { color: #ff4444; font-weight: bold; }
        .text-gray { color: #aaaaaa; font-size: 0.85em; }
        .text-pending { color: #ffaa00; font-size: 0.85em; font-weight: bold; }
        
        .btn-custom { background-color: #ffaa00 !important; color: #111 !important; font-weight: bold; border: none; }
        .btn-custom:hover { background-color: #e69900 !important; }
        
        .form-control { background-color: #1a1a1a !important; border: 1px solid #444; color: #fff !important; }
        .form-control::placeholder { color: #888 !important; }
        .form-control:focus { border-color: #ffaa00; box-shadow: 0 0 0 0.25rem rgba(255, 170, 0, 0.25); }
        
        .player-link { color: #e0e0e0; text-decoration: none; cursor: pointer; font-weight: bold; }
        .player-link:hover { color: #ffaa00; text-decoration: underline; }
        
        .modal-content { background-color: #2a2a2a; color: #e0e0e0; border: 1px solid #444; }
        .modal-header, .modal-footer { border-color: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 STALZONE PvP Ladder</h1>

        <div class="card">
            <div class="card-header">Добавить результат дуэли</div>
            <div class="card-body">
                <form id="duelForm" class="row g-3">
                    <div class="col-md-3"><input type="text" class="form-control" id="winner" placeholder="Победитель" required></div>
                    <div class="col-md-3"><input type="text" class="form-control" id="loser" placeholder="Проигравший" required></div>
                    <div class="col-md-2"><input type="text" class="form-control" id="score" placeholder="Счет (3:1)" required></div>
                    <div class="col-md-2"><input type="text" class="form-control" id="map" placeholder="Карта"></div>
                    <div class="col-md-2"><button type="submit" class="btn btn-custom w-100">Внести</button></div>
                </form>
                <div id="message" class="mt-3"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Таблица лидеров</span>
                        <button class="btn btn-sm btn-outline-light" onclick="loadData()">Обновить</button>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover text-center mb-0">
                            <thead><tr><th width="15%">#</th><th width="50%">Игрок</th><th width="35%">Рейтинг</th></tr></thead>
                            <tbody id="leaderboardBody"><tr><td colspan="3">Загрузка...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Последние дуэли</div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover text-center mb-0">
                            <thead><tr><th width="25%">Время</th><th width="75%">Матч</th></tr></thead>
                            <tbody id="historyBody"><tr><td colspan="2">Загрузка...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="profileName">Профиль</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Рейтинг: <span id="profileRating" class="rating"></span></p>
                    <p>Статистика: <span id="profileWins" class="text-win"></span> побед / <span id="profileLosses" class="text-lose"></span> поражений (<span id="profileWinrate"></span>% винрейт)</p>
                    <hr style="border-color: #444;">
                    <h6>Последние 5 матчей:</h6>
                    <ul id="profileMatches" class="list-unstyled mt-2" style="font-size: 0.9em;"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadData() {
            // Лидерборд
            try {
                const resL = await fetch('/leaderboard/');
                const dataL = await resL.json();
                const tbodyL = document.getElementById('leaderboardBody');
                tbodyL.innerHTML = dataL.length === 0 ? '<tr><td colspan="3">Нет игроков</td></tr>' : '';
                dataL.forEach((p, i) => {
                    tbodyL.innerHTML += `
                        <tr>
                            <td><strong>${i + 1}</strong></td>
                            <td><span class="player-link" onclick="showProfile('${p.nickname}')">${p.nickname}</span></td>
                            <td class="rating">${p.rating}</td>
                        </tr>`;
                });
            } catch (e) { console.error(e); }

            // История
            try {
                const resH = await fetch('/history/');
                const dataH = await resH.json();
                const tbodyH = document.getElementById('historyBody');
                tbodyH.innerHTML = dataH.length === 0 ? '<tr><td colspan="2">Матчей пока нет</td></tr>' : '';
                dataH.forEach(m => {
                    const mapText = m.map_name ? ` • ${m.map_name}` : '';
                    const isPending = m.status === 'pending';
                    const statusText = isPending ? `<br><span class="text-pending">⏳ Ожидает подтверждения</span>` : '';
                    
                    tbodyH.innerHTML += `
                        <tr style="${isPending ? 'opacity: 0.7;' : ''}">
                            <td class="text-gray">${m.time}</td>
                            <td style="font-size: 0.9em;">
                                <span class="text-win">${m.winner}</span> победил <span class="text-lose">${m.loser}</span>
                                <br><span class="text-gray">Счет: ${m.score}${mapText}</span>
                                ${statusText}
                            </td>
                        </tr>`;
                });
            } catch (e) { console.error(e); }
        }

        async function showProfile(nickname) {
            try {
                const res = await fetch(`/player/${nickname}`);
                if (!res.ok) throw new Error("Профиль не найден");
                const data = await res.json();

                document.getElementById('profileName').innerText = data.nickname;
                document.getElementById('profileRating').innerText = data.rating;
                document.getElementById('profileWins').innerText = data.wins;
                document.getElementById('profileLosses').innerText = data.losses;
                document.getElementById('profileWinrate').innerText = data.winrate;

                const matchList = document.getElementById('profileMatches');
                matchList.innerHTML = '';
                if (data.recent_matches.length === 0) {
                    matchList.innerHTML = '<li>Нет подтвержденных матчей</li>';
                } else {
                    data.recent_matches.forEach(m => {
                        const resColor = m.is_win ? 'text-win' : 'text-lose';
                        const resText = m.is_win ? 'Победа' : 'Поражение';
                        const opponent = m.is_win ? m.loser : m.winner;
                        matchList.innerHTML += `
                            <li class="mb-2">
                                <span class="${resColor}">${resText}</span> против ${opponent} 
                                <br><span class="text-gray">Счет: ${m.score} (${m.time})</span>
                            </li>`;
                    });
                }

                const modal = new bootstrap.Modal(document.getElementById('profileModal'));
                modal.show();
            } catch (e) { console.error(e); alert("Не удалось загрузить профиль"); }
        }

        document.getElementById('duelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const duelData = {
                winner_nickname: document.getElementById('winner').value,
                loser_nickname: document.getElementById('loser').value,
                score: document.getElementById('score').value,
                map_name: document.getElementById('map').value || null
            };
            try {
                const response = await fetch('/duels/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(duelData)
                });
                if (response.ok) {
                    const result = await response.json();
                    // Генерируем ссылку для соперника
                    const confirmUrl = `${window.location.origin}/confirm/${result.duel_id}`;
                    
                    document.getElementById('message').innerHTML = `
                        <div class="alert alert-warning py-2">
                            <strong>Матч создан!</strong> Рейтинг пока не изменен. 
                            <br>Отправьте эту ссылку сопернику для подтверждения:
                            <br><input type="text" class="form-control mt-2" value="${confirmUrl}" readonly onclick="this.select()">
                        </div>`;
                    document.getElementById('duelForm').reset();
                    loadData();
                }
            } catch (error) { console.error(error); }
        });

        loadData();
    </script>
</body>
</html>
